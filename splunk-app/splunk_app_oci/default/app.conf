#
# Splunk app configuration file
#
[ui]
is_visible = 1
label = Oracle Cloud App for Splunk

[launcher]
author = Vivian Richards (adapted for the oci-splunk project)
description = OCI dashboards for logs ingested by the oci-splunk project via SOC4Kafka (index=main, sourcetype=oci:log). Adapted from the original Oracle Cloud App for Splunk.
version = 2.1.5

[package]
id = splunk_app_oci
check_for_updates = false

[install]
is_configured = 0

[triggers]
reload.addon_builder = simple
