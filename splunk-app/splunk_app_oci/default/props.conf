[com.oraclecloud.vcn.flowlogs.DataEvent]
FIELDALIAS-oci_vcn_src_and_dest = "data.destinationAddress" ASNEW dest "data.destinationPort" ASNEW dest_port "data.sourceAddress" ASNEW src "data.sourcePort" ASNEW src_port destinationAddress ASNEW dest sourceAddress ASNEW src

# This project ships every OCI log (Audit, VCN flow, etc.) to Splunk as the
# CloudEvents JSON envelope under a single sourcetype (oci:log). JSON
# auto-extraction exposes data.*, oracle.*, and type; the field aliases mirror
# the per-type stanza above so VCN dashboards resolve src/dest/ports here too.
[oci:log]
KV_MODE = json
TIME_PREFIX = "time"\s*:\s*"
TIME_FORMAT = %Y-%m-%dT%H:%M:%S.%6NZ
MAX_TIMESTAMP_LOOKAHEAD = 40
TRUNCATE = 0
FIELDALIAS-oci_vcn_src_and_dest = "data.destinationAddress" ASNEW dest "data.destinationPort" ASNEW dest_port "data.sourceAddress" ASNEW src "data.sourcePort" ASNEW src_port
FIELDALIAS-oci_event = "data.eventName" ASNEW eventName "data.compartmentName" ASNEW compartmentName "data.identity.principalName" ASNEW principalName "data.identity.ipAddress" ASNEW src_ip
# CIM Network Traffic helpers for VCN flow logs (dashboards that run `oci_trim`
# rename data.action -> action afterward, so ACCEPT/REJECT still works there).
FIELDALIAS-oci_cim_bytes = "data.bytesOut" ASNEW bytes
EVAL-transport = lower('data.protocolName')
EVAL-action = case('data.action'=="ACCEPT","allowed",'data.action'=="REJECT","blocked")

