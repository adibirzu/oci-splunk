### -------------------------------------------------------------------------
### oci-splunk project: out-of-the-box detections (scheduled alerts).
### They run on a schedule and track to Activity > Triggered Alerts (no email
### required). Tune thresholds/cron to your environment.
### -------------------------------------------------------------------------

[OCI - VCN rejected traffic spike]
search = `oci_vcn_logs` `oci_trim` | search action=REJECT | stats count by src | where count > 100
description = OCI VCN flow logs: a source address with a burst of REJECTED flows (possible scan/blocked traffic).
cron_schedule = */10 * * * *
dispatch.earliest_time = -10m
dispatch.latest_time = now
enableSched = 1
counttype = number of events
relation = greater than
quantity = 0
alert.track = 1
alert.severity = 4

[OCI - Audit failures]
search = `oci_index` oracle.loggroupid=_audit `oci_trim` | search "data.eventName"=* (message="*fail*" OR message="*denied*" OR message="*Unauthorized*" OR message="*TooManyRequests*") | stats count by compartmentName type_shortname message
description = OCI Audit: failed, denied, or throttled control-plane actions.
cron_schedule = */15 * * * *
dispatch.earliest_time = -15m
dispatch.latest_time = now
enableSched = 1
counttype = number of events
relation = greater than
quantity = 0
alert.track = 1
alert.severity = 3

[OCI - IAM and policy changes]
search = `oci_index` oracle.loggroupid=_audit `oci_trim` | search (type="*identity*" OR type="*Policy*" OR type="*Group*" OR type="*User*") (type="*Create*" OR type="*Update*" OR type="*Delete*") | stats count by compartmentName type_shortname principalName
description = OCI Audit: identity/policy/user/group changes (create/update/delete).
cron_schedule = */15 * * * *
dispatch.earliest_time = -15m
dispatch.latest_time = now
enableSched = 1
counttype = number of events
relation = greater than
quantity = 0
alert.track = 1
alert.severity = 4

[OCI - New external source IP (object storage)]
search = `oci_index` `oci_trim` | search type_source=objectstorage | iplocation src_ip | search src_ip!=10.* src_ip!=172.1[6-9].* src_ip!=172.2*.* src_ip!=172.3[01].* src_ip!=192.168.* | stats count earliest(_time) as first_seen by src_ip principalName Country
description = OCI Object Storage accessed from a public (non-RFC1918) source IP.
cron_schedule = 5 * * * *
dispatch.earliest_time = -1h
dispatch.latest_time = now
enableSched = 1
counttype = number of events
relation = greater than
quantity = 0
alert.track = 1
alert.severity = 3
