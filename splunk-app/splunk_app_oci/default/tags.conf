# CIM tagging. VCN flow logs map to the Network Traffic data model; audit and
# object-storage events are tagged for change/audit pivots. Field normalization
# for the network model is in props.conf ([oci:log] aliases: src, dest,
# src_port, dest_port, action, bytes, transport).

[eventtype=oci_vcn_flow]
network = enabled
communicate = enabled

[eventtype=oci_audit]
change = enabled
audit = enabled

[eventtype=oci_objectstore]
change = enabled
